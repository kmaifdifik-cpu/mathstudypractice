<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Links</title> <style>
:root {
  --bg:#000;
  --text:#fff;
  --muted:#aaa;
  --border:rgba(255,255,255,.14);
  --card:rgba(255,255,255,.035);
  --card-hover:rgba(255,255,255,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#000;overflow-x:hidden
}
#particles{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
header{text-align:center;padding:70px 20px 25px;animation:fadeDown .8s ease both}
.logo{
  width:72px;height:72px;margin:0 auto 20px;display:grid;place-items:center;
  border-radius:20px;background:#080808;border:1px solid rgba(255,255,255,.25);
  box-shadow:0 0 30px rgba(255,255,255,.12),inset 0 1px rgba(255,255,255,.15);
  font-size:32px;font-weight:900;animation:pulse 4s ease-in-out infinite
}
@keyframes pulse{50%{box-shadow:0 0 45px rgba(255,255,255,.22),inset 0 1px rgba(255,255,255,.2)}}
h1{font-size:clamp(38px,7vw,72px);letter-spacing:-3px;line-height:1}
.gradient-text{color:#fff}
.nav{
  max-width:1100px;margin:25px auto 10px;padding:0 20px;
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center
}
.nav button{
  border:1px solid var(--border);color:#fff;background:rgba(0,0,0,.65);
  backdrop-filter:blur(10px);border-radius:999px;padding:9px 15px;cursor:pointer;
  transition:.25s
}
.nav button:hover,.nav button.active{
  color:#000;border-color:#fff;background:#fff;transform:translateY(-2px);
  box-shadow:0 0 18px rgba(255,255,255,.2)
}
main{width:min(1150px,calc(100% - 30px));margin:35px auto 100px}
.category{margin-top:48px;animation:fadeUp .7s ease both}
.category-title{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.category-title h2{font-size:23px;color:#fff}
.category-title span{color:var(--muted);font-size:13px}
.line{height:1px;flex:1;background:linear-gradient(90deg,rgba(255,255,255,.4),transparent)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.link-card{
  position:relative;display:flex;align-items:center;gap:14px;min-height:82px;padding:17px;
  border:1px solid var(--border);border-radius:18px;color:#fff;text-decoration:none;
  background:var(--card);backdrop-filter:blur(16px);overflow:hidden;
  transition:transform .25s ease,border-color .25s ease,background .25s ease,box-shadow .25s ease;
  animation:cardIn .5s ease both
}
.link-card::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.12),transparent 80%);
  transform:translateX(-120%);transition:.6s
}
.link-card:hover::before{transform:translateX(120%)}
.link-card:hover{
  transform:translateY(-5px) scale(1.01);background:var(--card-hover);
  border-color:rgba(255,255,255,.55);
  box-shadow:0 15px 45px rgba(0,0,0,.5),0 0 25px rgba(255,255,255,.08)
}
.icon{
  width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:21px
}
.link-info{min-width:0}
.link-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-url{margin-top:4px;color:#888;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{margin-left:auto;color:#777;transition:.25s}
.link-card:hover .arrow{color:#fff;transform:translateX(4px)}
@keyframes fadeDown{from{opacity:0;transform:translateY(-25px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){
  header{padding-top:45px}h1{letter-spacing:-2px}.links{grid-template-columns:1fr}.category{margin-top:35px}
}
.dock {
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  display:flex;gap:14px;z-index:10;
  background:rgba(0,0,0,.65);backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:999px;padding:10px;
}
.dock a {
  width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;text-decoration:none;transition:.25s;
}
.dock a:hover{background:#fff;color:#000;}
.dock svg{width:22px;height:22px;fill:currentColor;}

<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let particles = [];

function resizeParticles() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  particles = Array.from({length: Math.min(120, Math.floor(window.innerWidth / 10))}, () => ({
    x: Math.random()*window.innerWidth,
    y: Math.random()*window.innerHeight,
    r: Math.random()*1.7+.3,
    vx:(Math.random()-.5)*.35,
    vy:(Math.random()-.5)*.35,
    a:Math.random()*.65+.2
  }));
}
function animateParticles() {
  ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if(p.x<0)p.x=window.innerWidth;
    if(p.x>window.innerWidth)p.x=0;
    if(p.y<0)p.y=window.innerHeight;
    if(p.y>window.innerHeight)p.y=0;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${p.a})`;
    ctx.fill();
  }
  requestAnimationFrame(animateParticles);
}
window.addEventListener("resize", resizeParticles);
resizeParticles();
animateParticles();
</script>
