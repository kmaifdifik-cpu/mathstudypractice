  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe id="fm" src="about:blank"></iframe>
  <script>
    (async () => {
      try {
        const url = 'https://quantil.jsdelivr.net/gh/kmaifdifik-cpu/mathstudypractice/site.html?t=' + Date.now();
        const res = await fetch(url);
        const text = await res.text();
        const frame = document.getElementById('fm');
        const fdoc = frame.contentDocument || frame.contentWindow.document;
        fdoc.open();
        fdoc.write(text);
        fdoc.close();
      } catch(e) {
        console.error('Loader error:', e);
      }
    })();
  </script>
</body>
